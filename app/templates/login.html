{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:auto">
  <h2>Sign in</h2>
  {% if error %}<div class="msg error" data-testid="login-error">{{ error }}</div>{% endif %}
  <form method="post" data-testid="login-form">
    <p><input id="email" name="email" type="text" placeholder="Email" style="width:95%"></p>
    <p><input id="password" name="password" type="password" placeholder="Password" style="width:95%"></p>
    <button id="login-btn" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
